name: CI

on:
  push:
    branches: [new-JV]
  pull_request:
    branches: [main, new-JV]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: phyuijjekxtjvipjtdfv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency critical vulnerability gate
        run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npm run typecheck
      # 17b : npm test = tous les src/**/*.test.ts (sessionScope y compris).
      - run: npm test
      - name: Session generation regression
        run: node --import tsx --test src/lib/sessionScope.test.ts
      - name: Profile store session isolation
        run: node scripts/test-profile-session.mjs
      - name: Service worker cache isolation
        run: node scripts/test-service-worker.mjs
      - run: npm run verify:migrations
      - run: npm run verify:edges
      - name: Detect Management API token
        id: token
        run: |
          if [ -n "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CLI prod::SUPABASE_ACCESS_TOKEN absent — migration list / dry-run skipped (not a successful proof)."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.present == 'true'
        with:
          version: 2.117.0
      - name: Prod migration list + db push --dry-run
        if: steps.token.outputs.present == 'true'
        run: |
          chmod +x scripts/prod-migration-sync.sh
          bash scripts/prod-migration-sync.sh
      - name: Upload prod CLI proof
        if: always() && steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prod-cli-proof
          path: /tmp/prometheus-mig/
          if-no-files-found: ignore
      - run: npm run build

  rls-matrix:
    name: rls-matrix (staging-like)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase (staging-like, Postgres 17)
        run: supabase start -x studio,mailpit,logflare,vector,imgproxy,edge-runtime
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Align local vs lock (toutes les versions lock)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/verify-local-migrations.mjs
      - name: Local migration list (replay)
        run: |
          {
            echo '## supabase migration list --local'
            echo
            echo '```'
            supabase migration list --local || echo 'flag --local indisponible sur cette CLI'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run RLS matrix
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          RLS_RESULTS_PATH: /tmp/rls-matrix-results.txt
        run: node scripts/run-rls-matrix.mjs
      - name: Test client departure
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/client_departure.sql | tee /tmp/client-departure-db-results.txt
      - name: Test relationship consent
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/relationship_consent.sql | tee /tmp/relationship-consent-db-results.txt
      - name: Test account capabilities
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/account_capabilities.sql | tee /tmp/account-capabilities-db-results.txt
      - name: Test independent Coach capability
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/independent_coach_capability.sql
      - name: Test set_coaching_role roster guard
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/set_coaching_role_roster.sql | tee /tmp/set-coaching-role-roster-db-results.txt
      - name: Test save_program atomic write
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/save_program.sql | tee /tmp/save-program-db-results.txt
      - name: Test account entry intent
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/account_entry_intent.sql | tee /tmp/account-entry-intent-db-results.txt
      - name: Test coach marketplace
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/coach_marketplace.sql | tee /tmp/coach-marketplace-db-results.txt
      - name: Test questionnaire migrated schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/coach_questionnaires.sql | tee /tmp/questionnaire-db-results.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit hardening regression (migrated database)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/marketplace_audit_hardening.sql
      - name: Questionnaire browser journey (local Supabase only)
        run: node scripts/test-questionnaire-browser.mjs
      - name: Independent Coach capability browser journey
        run: node scripts/test-coach-capability-browser.mjs
      - name: Upload Coach capability browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-capability-browser-proof
          path: artifacts/p11/
          if-no-files-found: warn
      - name: Upload questionnaire browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questionnaire-browser-proof
          path: artifacts/questionnaire/
          if-no-files-found: warn
      - name: Upload questionnaire database proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questionnaire-db-results
          path: /tmp/questionnaire-db-results.txt
          if-no-files-found: warn
      - name: Publish RLS results
        if: always()
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          {
            echo '## Matrice RLS (staging-like supabase start PG17)'
            echo
            echo '```'
            psql "$DATABASE_URL" -P pager=off -c "SELECT check_id, passed, detail FROM rls_results ORDER BY check_id" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p artifacts
          cp /tmp/rls-matrix-results.txt artifacts/rls-matrix-results.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rls-matrix-results
          path: artifacts/rls-matrix-results.txt
          if-no-files-found: ignore
