name: CI

on:
  push:
    branches: [new-JV]
  pull_request:
    branches: [main, new-JV]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: phyuijjekxtjvipjtdfv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency critical vulnerability gate
        # Installed-tree `audits/quick` now 400s ("Invalid package tree") after the
        # endpoint retirement. Lockfile audit still fails closed on critical findings.
        run: npm audit --package-lock-only --audit-level=critical
      - run: npm run lint
      - run: npm run typecheck
      # 17b : npm test = tous les src/**/*.test.ts (sessionScope y compris).
      - run: npm test
      - name: Session generation regression
        run: node --import tsx --test src/lib/sessionScope.test.ts
      - name: Profile store session isolation
        run: node scripts/test-profile-session.mjs
      - name: Service worker cache isolation
        run: node scripts/test-service-worker.mjs
      - run: npm run verify:migrations
      - run: npm run verify:edges
      - name: Require Supabase production proof credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || missing+=("SUPABASE_ACCESS_TOKEN")
          [[ -n "${SUPABASE_DB_PASSWORD:-}" ]] || missing+=("SUPABASE_DB_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            joined="$(IFS=', '; echo "${missing[*]}")"
            echo "::error title=Supabase production proof unavailable::Missing repository secret(s): ${joined}. Production migration list and db push --dry-run are mandatory."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Production migration list + db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          chmod +x scripts/prod-migration-sync.sh
          bash scripts/prod-migration-sync.sh
      - name: Upload prod CLI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-cli-proof
          path: /tmp/prometheus-mig/
          if-no-files-found: ignore
      - run: npm run build

  rls-matrix:
    name: rls-matrix (staging-like)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase (staging-like, Postgres 17)
        run: supabase start -x studio,mailpit,logflare,vector,imgproxy,edge-runtime
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Align local vs lock (toutes les versions lock)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/verify-local-migrations.mjs
      - name: Local migration list (replay)
        run: |
          {
            echo '## supabase migration list --local'
            echo
            echo '```'
            supabase migration list --local || echo 'flag --local indisponible sur cette CLI'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run RLS matrix
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          RLS_RESULTS_PATH: /tmp/rls-matrix-results.txt
        run: node scripts/run-rls-matrix.mjs
      - name: Test client departure
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/client_departure.sql | tee /tmp/client-departure-db-results.txt
      - name: Test commercial durations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/commercial_durations.sql | tee /tmp/commercial-durations-db-results.txt
      - name: Confirm commercial durations echo
        run: |
          set -euo pipefail
          grep -F 'commercial durations: solo trial 14 days and coach grace 7 days' /tmp/commercial-durations-db-results.txt
          grep -F 'client departure: isolation, rollback, archives, revocation, role transition and repeat checks passed' /tmp/client-departure-db-results.txt
      - name: Test athlete signals
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/athlete_signals.sql | tee /tmp/athlete-signals-db-results.txt
      - name: Confirm athlete signals echo
        run: |
          set -euo pipefail
          grep -F 'athlete signals: persistence, isolation, no auto-apply' /tmp/athlete-signals-db-results.txt
      - name: Test athlete weekly reviews
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/athlete_weekly_reviews.sql | tee /tmp/athlete-weekly-reviews-db-results.txt
      - name: Confirm athlete weekly reviews echo
        run: |
          set -euo pipefail
          grep -F 'weekly review: universal engine, wait is valid, no auto-apply' /tmp/athlete-weekly-reviews-db-results.txt
      - name: Test athlete decision log
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/athlete_decision_log.sql | tee /tmp/athlete-decision-log-db-results.txt
      - name: Confirm athlete decision log echo
        run: |
          set -euo pipefail
          grep -F 'decision log: human refusal shapes the next review, no auto-apply' /tmp/athlete-decision-log-db-results.txt
      - name: Test athlete review integrity
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/athlete_review_integrity.sql | tee /tmp/athlete-review-integrity-db-results.txt
      - name: Confirm athlete review integrity echo
        run: |
          set -euo pipefail
          grep -F 'review integrity: atomic upsert, wait persisted, mismatch blocked, latest per key' /tmp/athlete-review-integrity-db-results.txt
      - name: Test athlete decision durability
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/athlete_decision_durability.sql | tee /tmp/athlete-decision-durability-db-results.txt
      - name: Confirm athlete decision durability echo
        run: |
          set -euo pipefail
          grep -F 'decision durability: outbox isolation, drain replay, immutable intent, solo journal-fail reprise' /tmp/athlete-decision-durability-db-results.txt
      - name: Test athlete decision drain concurrency
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/test-decision-drain-concurrency.sh | tee /tmp/athlete-decision-drain-concurrency.txt
      - name: Confirm athlete decision drain concurrency echo
        run: |
          set -euo pipefail
          grep -F 'decision drain concurrency: skip occupied key, two sessions no deadlock' /tmp/athlete-decision-drain-concurrency.txt
      - name: Test athlete watch context correction
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/athlete_watch_context.sql | tee /tmp/athlete-watch-context-db-results.txt
      - name: Confirm athlete watch context echo
        run: |
          set -euo pipefail
          grep -F 'athlete watch context: solo and coach can correct, coached cannot, no source rewrite' /tmp/athlete-watch-context-db-results.txt
      - name: Test athlete watch proposal decision
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/athlete_watch_proposal.sql | tee /tmp/athlete-watch-proposal-db-results.txt
      - name: Confirm athlete watch proposal echo
        run: |
          set -euo pipefail
          grep -F 'athlete watch proposal: solo and coach can decide, coached cannot, refuse keeps signal open, custom B does not inherit A' /tmp/athlete-watch-proposal-db-results.txt
      - name: Test relationship consent
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/relationship_consent.sql | tee /tmp/relationship-consent-db-results.txt
      - name: Test account capabilities
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/account_capabilities.sql | tee /tmp/account-capabilities-db-results.txt
      - name: Test independent Coach capability
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/independent_coach_capability.sql
      - name: Test coach_client_links identity immutability
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/coach_client_link_immutability.sql | tee /tmp/coach-client-link-immutability-db-results.txt
      - name: Confirm coach_client_links identity echo
        run: |
          set -euo pipefail
          grep -F 'coach_client_links: identity immutable, status RPC-only, bookkeeping and métier RPCs still work' /tmp/coach-client-link-immutability-db-results.txt
      - name: Test P2 primitive authority
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/p2_primitive_authority.sql | tee /tmp/p2-primitive-authority-db-results.txt
      - name: Confirm P2 primitive authority echo
        run: |
          set -euo pipefail
          grep -F 'p2 primitives: Data API execute revoked, métier RPCs and service path still work' /tmp/p2-primitive-authority-db-results.txt
      - name: Test set_coaching_role roster guard
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/set_coaching_role_roster.sql | tee /tmp/set-coaching-role-roster-db-results.txt
      - name: Test save_program atomic write
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/save_program.sql | tee /tmp/save-program-db-results.txt
      - name: Test save_program coached leftover owner guard
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/save_program_coached.sql | tee /tmp/save-program-coached-db-results.txt
      - name: Confirm leftover owner-guard echo
        run: |
          set -euo pipefail
          grep -F 'save_program coached leftover owner guard passed' /tmp/save-program-coached-db-results.txt
      - name: Test program session organization
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/program_session_organization.sql | tee /tmp/program-session-organization-db-results.txt
      - name: Confirm program session organization echo
        run: |
          set -euo pipefail
          grep -F 'program session organization: legacy fixed_days, in_order null weekdays, leftover lock, fork copy' /tmp/program-session-organization-db-results.txt
      - name: Test program phases
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/program_phases.sql | tee /tmp/program-phases-db-results.txt
      - name: Confirm program phases echo
        run: |
          set -euo pipefail
          grep -F 'program phases: simple optional, periodized same engine, deload is a phase, logger stamps, leftover lock, fork copies' /tmp/program-phases-db-results.txt
      - name: Test program versions
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/program_versions.sql | tee /tmp/program-versions-db-results.txt
      - name: Confirm program versions echo
        run: |
          set -euo pipefail
          grep -F 'program versions: saved without live mutate, schedule/replace, activate idempotent, historical locked, leftover, logger stamp' /tmp/program-versions-db-results.txt
      - name: Test program hardening
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/program_hardening.sql | tee /tmp/program-hardening-db-results.txt
      - name: Confirm program hardening echo
        run: |
          set -euo pipefail
          grep -F 'program hardening: phase engine, duplicate weekdays, server prescription, civil date, relation end, Data API, name/description, helper ACL, delete, frozen tz' /tmp/program-hardening-db-results.txt
          grep -F 'delete_program locks program row FOR UPDATE before checks' /tmp/program-hardening-db-results.txt
          grep -F 'program hardening: provenance immutability, program_id stamp, prescribed freeze, version backfill, activate now vs due' /tmp/program-hardening-db-results.txt
          grep -F 'program hardening: allowlist ACL, assignment Data API closed, laterOf start, 20/21 sets, mixed phases, prescription_source' /tmp/program-hardening-db-results.txt
          grep -F 'program hardening: live graph active-only, revision drafts, not-started, past schedule, freeze FOR UPDATE, archive RPC' /tmp/program-hardening-db-results.txt
      - name: Test shared program archive
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/program_shared_archive.sql | tee /tmp/program-shared-archive-db-results.txt
      - name: Confirm shared program archive echo
        run: |
          set -euo pipefail
          grep -F 'shared program archive: A leaves, B continues, frozen snapshot' /tmp/program-shared-archive-db-results.txt
          grep -F 'shared program archive: paused A cannot read live graph or drafts' /tmp/program-shared-archive-db-results.txt
      - name: Test coach switch archive
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/program_coach_switch.sql | tee /tmp/program-coach-switch-db-results.txt
      - name: Confirm coach switch archive echo
        run: |
          set -euo pipefail
          grep -F 'coach switch archive: B cannot read paused live or drafts; adopt copies frozen A' /tmp/program-coach-switch-db-results.txt
          grep -F 'coach switch archive: adopt paused copies Push A not live Push B' /tmp/program-coach-switch-db-results.txt
          grep -F 'coach switch archive: adopt exact assignment active+paused copies own revision' /tmp/program-coach-switch-db-results.txt
          grep -F 'coach switch archive: adopt exact assignment two paused copies own frozen revision' /tmp/program-coach-switch-db-results.txt
          grep -F 'coach switch archive: adopt refuses other coach, former coach, missing, unfrozen' /tmp/program-coach-switch-db-results.txt
      - name: Test delete_program row lock concurrency
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/test-delete-program-lock.sh | tee /tmp/delete-program-lock-concurrency.txt
      - name: Confirm delete_program row lock concurrency echo
        run: |
          set -euo pipefail
          grep -F 'delete_program row lock: in-flight assign cannot sneak past FOR UPDATE' /tmp/delete-program-lock-concurrency.txt
      - name: Test freeze/activation row lock concurrency
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/test-program-freeze-lock.sh | tee /tmp/program-freeze-lock-concurrency.txt
      - name: Confirm freeze/activation row lock concurrency echo
        run: |
          set -euo pipefail
          grep -F 'freeze/activation row lock: Cas A pin new revision; Cas B pin old then owner library; Cas C save_program serializes' /tmp/program-freeze-lock-concurrency.txt
      - name: Test adopt vs assign row lock concurrency
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/test-adopt-assign-lock.sh | tee /tmp/adopt-assign-lock-concurrency.txt
      - name: Confirm adopt vs assign row lock concurrency echo
        run: |
          set -euo pipefail
          grep -F 'adopt/assign row lock: adopt×assign_program_secure and adopt×create_program_complete serialize without deadlock' /tmp/adopt-assign-lock-concurrency.txt
      - name: Test assignment client mutex concurrency
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/test-assignment-client-mutex.sh | tee /tmp/assignment-client-mutex-concurrency.txt
      - name: Confirm assignment client mutex concurrency echo
        run: |
          set -euo pipefail
          grep -F 'assignment client mutex: assign×assign, create×create, assign×end, assign×close serialize without stale lock-set' /tmp/assignment-client-mutex-concurrency.txt
      - name: Test close_coach_account P3
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/program_close_coach_account.sql | tee /tmp/program-close-coach-account-db-results.txt
      - name: Confirm close_coach_account P3 echo
        run: |
          set -euo pipefail
          grep -F 'close_coach_account P3: snapshots, phases, org, prescriptions, freeze pin, workout provenance, retry' /tmp/program-close-coach-account-db-results.txt
      - name: Test close_coach_account fail-closed unfrozen archive
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/program_close_archive_not_frozen.sql | tee /tmp/program-close-archive-not-frozen-db-results.txt
      - name: Confirm close_coach_account fail-closed echo
        run: |
          set -euo pipefail
          grep -F 'close_coach_account fail-closed: paused NULL frozen_revision_no refuses live V2, atomic' /tmp/program-close-archive-not-frozen-db-results.txt
      - name: Test coach lifecycle mutex concurrency
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/test-coach-lifecycle-mutex.sh | tee /tmp/coach-lifecycle-mutex-concurrency.txt
      - name: Confirm coach lifecycle mutex concurrency echo
        run: |
          set -euo pipefail
          grep -F 'coach lifecycle mutex: close×activate Cas A includes C; Cas B confirm/invite refuse closed Coach without deadlock' /tmp/coach-lifecycle-mutex-concurrency.txt
      - name: Test confirm × activate lock order concurrency
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/test-confirm-activate-lock.sh | tee /tmp/confirm-activate-lock-concurrency.txt
      - name: Confirm confirm × activate lock order echo
        run: |
          set -euo pipefail
          grep -F 'confirm×activate lock order: Cas A confirm holds Coach mutex, Cas B activate holds Coach mutex; both serialize without deadlock; one active link' /tmp/confirm-activate-lock-concurrency.txt
      - name: Test account entry intent
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/account_entry_intent.sql | tee /tmp/account-entry-intent-db-results.txt
      - name: Test coach marketplace
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/coach_marketplace.sql | tee /tmp/coach-marketplace-db-results.txt
      - name: Confirm marketplace athlete-confirm echo
        run: |
          set -euo pipefail
          grep -F 'athlete confirm activates coaching' /tmp/coach-marketplace-db-results.txt
          grep -F 'legacy accepted stays accepted' /tmp/coach-marketplace-db-results.txt
      - name: Test questionnaire migrated schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/coach_questionnaires.sql | tee /tmp/questionnaire-db-results.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit hardening regression (migrated database)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/marketplace_audit_hardening.sql | tee /tmp/marketplace-audit-db-results.txt
      - name: Confirm marketplace historical-confirm echo
        run: |
          set -euo pipefail
          grep -F 'historical confirmation does not reactivate' /tmp/marketplace-audit-db-results.txt
          grep -F 'leftover accepted stays accepted' /tmp/marketplace-audit-db-results.txt
      - name: Questionnaire browser journey (local Supabase only)
        run: node scripts/test-questionnaire-browser.mjs | tee /tmp/questionnaire-browser-results.txt
      - name: Independent Coach capability browser journey
        run: node scripts/test-coach-capability-browser.mjs
      - name: Resource/action permissions browser journey
        run: node scripts/test-resource-permissions-browser.mjs
      - name: Personal calendar browser journey
        run: node scripts/test-personal-calendar-browser.mjs
      - name: Confirm browser PASS files
        run: |
          set -euo pipefail
          grep -F 'PASS: coached stats history' artifacts/p12/results.txt
          grep -F 'PASS: coached calendar past/future' artifacts/p13/results.txt
          grep -F 'PASS: responsive directory, concurrent confirmation' /tmp/questionnaire-browser-results.txt
      - name: Upload Coach capability browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-capability-browser-proof
          path: artifacts/p11/
          if-no-files-found: warn
      - name: Upload resource permissions browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-permissions-browser-proof
          path: artifacts/p12/
          if-no-files-found: warn
      - name: Upload personal calendar browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-calendar-browser-proof
          path: artifacts/p13/
          if-no-files-found: warn
      - name: Upload questionnaire browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questionnaire-browser-proof
          path: artifacts/questionnaire/
          if-no-files-found: warn
      - name: Upload questionnaire database proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questionnaire-db-results
          path: /tmp/questionnaire-db-results.txt
          if-no-files-found: warn
      - name: Publish RLS results
        if: always()
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          {
            echo '## Matrice RLS (staging-like supabase start PG17)'
            echo
            echo '```'
            psql "$DATABASE_URL" -P pager=off -c "SELECT check_id, passed, detail FROM rls_results ORDER BY check_id" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p artifacts
          cp /tmp/rls-matrix-results.txt artifacts/rls-matrix-results.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rls-matrix-results
          path: artifacts/rls-matrix-results.txt
          if-no-files-found: ignore
