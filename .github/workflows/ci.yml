name: CI

on:
  push:
    branches: [new-JV]
  pull_request:
    branches: [main, new-JV]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: phyuijjekxtjvipjtdfv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:migrations
      - run: npm run verify:edges
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Prod migration list + db push --dry-run
        run: |
          chmod +x scripts/prod-migration-sync.sh scripts/deploy-audit-edges.sh
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN absent — migration list / dry-run CLI sautés."
            echo "Poser le secret Management API puis relancer pour la preuve horloge Git=prod."
            exit 0
          fi
          bash scripts/prod-migration-sync.sh
      - run: npm run build

  rls-matrix:
    name: rls-matrix (staging-like)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase (staging-like, Postgres 17)
        run: supabase start -x studio,mailpit,realtime,logflare,vector,imgproxy,edge-runtime
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Align local vs lock (toutes les versions lock)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/verify-local-migrations.mjs
      - name: Local migration list (replay)
        run: |
          {
            echo '## supabase migration list --local'
            echo
            echo '```'
            supabase migration list --local || echo 'flag --local indisponible sur cette CLI'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run RLS matrix
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          RLS_RESULTS_PATH: /tmp/rls-matrix-results.txt
        run: node scripts/run-rls-matrix.mjs
      - name: Publish RLS results
        if: always()
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          {
            echo '## Matrice RLS (staging-like supabase start PG17)'
            echo
            echo '```'
            psql "$DATABASE_URL" -P pager=off -c "SELECT check_id, passed, detail FROM rls_results ORDER BY check_id" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p artifacts
          cp /tmp/rls-matrix-results.txt artifacts/rls-matrix-results.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rls-matrix-results
          path: artifacts/rls-matrix-results.txt
          if-no-files-found: ignore

  deploy-edges:
    name: deploy-edges (CLI)
    needs: verify
    if: github.event_name == 'pull_request' && github.head_ref == 'cursor/audit-securisation-425e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: phyuijjekxtjvipjtdfv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Deploy coach-fleet-round + coach-agent via CLI
        run: |
          chmod +x scripts/deploy-audit-edges.sh
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN absent — preuve CLI impossible. Poser le secret Management API puis relancer ce job."
            echo "SUPABASE_ACCESS_TOKEN absent du dépôt GitHub — CLI deploy sauté."
            exit 0
          fi
          bash scripts/deploy-audit-edges.sh
