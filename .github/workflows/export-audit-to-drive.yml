name: Export Prometheus Audit Context to Google Drive

on:
  push:
    branches:
      - new-JV
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-prometheus-audit-new-jv
  cancel-in-progress: true

jobs:
  export-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Validate Drive configuration
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          key = os.environ.get('GDRIVE_SERVICE_ACCOUNT_KEY', '')
          folder = os.environ.get('GDRIVE_FOLDER_ID', '')
          if not key:
              raise SystemExit('GDRIVE_SERVICE_ACCOUNT_KEY is missing.')
          if not folder:
              raise SystemExit('GDRIVE_FOLDER_ID is missing.')
          data = json.loads(key)
          required = {'client_email', 'private_key', 'token_uri'}
          missing = sorted(required.difference(data))
          if missing:
              raise SystemExit(f'Service-account JSON is missing: {", ".join(missing)}')
          if not re.fullmatch(r'[A-Za-z0-9_-]+', folder):
              raise SystemExit('GDRIVE_FOLDER_ID has an invalid format.')
          print('Drive configuration is present and structurally valid.')
          PY

      - name: Generate complete audit context
        env:
          AUDIT_BASE_SHA: ${{ github.event.before }}
          AUDIT_HEAD_SHA: ${{ github.sha }}
          AUDIT_BRANCH: ${{ github.ref_name }}
          AUDIT_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import os
          import subprocess

          OUTPUT = Path('latest_frontend_audit_context.md')
          MAX_SECTION = 120_000
          MAX_DOCS = 350_000

          def run(*args):
              proc = subprocess.run(
                  args,
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  encoding='utf-8',
                  errors='replace',
              )
              return proc.returncode, proc.stdout.rstrip()

          def git(*args):
              code, output = run('git', *args)
              if code:
                  return f"[git {' '.join(args)} failed]\n{output}"
              return output

          def valid_commit(sha):
              if not sha or set(sha) == {'0'}:
                  return False
              code, _ = run('git', 'cat-file', '-e', f'{sha}^{{commit}}')
              return code == 0

          def cap(text, limit=MAX_SECTION):
              if len(text) <= limit:
                  return text
              return text[:limit] + f"\n\n[Section truncated after {limit} characters.]"

          head = os.environ.get('AUDIT_HEAD_SHA') or git('rev-parse', 'HEAD')
          requested_base = os.environ.get('AUDIT_BASE_SHA', '')
          if valid_commit(requested_base):
              base = requested_base
          else:
              parent = git('rev-parse', f'{head}^')
              base = parent if valid_commit(parent) else head

          branch = os.environ.get('AUDIT_BRANCH', 'new-JV')
          event = os.environ.get('AUDIT_EVENT', 'unknown')
          generated = datetime.now(timezone.utc).isoformat(timespec='seconds')
          diff_args = (base, head)

          recent_commits = git(
              'log', '-n', '20',
              '--pretty=format:%h | %ad | %s | %an',
              '--date=iso-strict',
          )
          pushed_commits = git(
              'log', '--reverse',
              '--pretty=format:%h | %ad | %s | %an',
              '--date=iso-strict', f'{base}..{head}',
          )
          changed_files = git('diff', '--name-status', *diff_args)
          diff_stat = git('diff', '--stat', *diff_args)
          docs_diff = git('diff', *diff_args, '--', 'docs/', 'CLAUDE.md', 'README.md')
          backend_diff = git('diff', *diff_args, '--', 'supabase/')
          frontend_diff = git('diff', *diff_args, '--', 'src/', 'public/')
          delivery_diff = git(
              'diff', *diff_args, '--', '.',
              ':(exclude)src/**', ':(exclude)public/**',
              ':(exclude)supabase/**', ':(exclude)docs/**',
              ':(exclude)CLAUDE.md', ':(exclude)README.md',
          )

          docs_parts = []
          docs_size = 0
          candidates = [Path('CLAUDE.md'), Path('README.md')]
          if Path('docs').is_dir():
              candidates.extend(sorted(
                  p for p in Path('docs').rglob('*')
                  if p.is_file() and p.suffix.lower() in {'.md', '.txt', '.json'}
              ))
          for path in candidates:
              if not path.is_file():
                  continue
              content = path.read_text(encoding='utf-8', errors='replace')
              block = f"\n#### File: `{path.as_posix()}`\n\n```text\n{content}\n```\n"
              if docs_size + len(block) > MAX_DOCS:
                  docs_parts.append(
                      f"\n[Documentation truncated after {MAX_DOCS} characters; "
                      f"next file would have been `{path.as_posix()}`.]\n"
                  )
                  break
              docs_parts.append(block)
              docs_size += len(block)
          full_docs = ''.join(docs_parts) or 'No documentation files found.'

          sections = [
              '# Prometheus Tracker — Audit context for `new-JV`',
              '',
              f'- Generated (UTC): `{generated}`',
              f'- Event: `{event}`',
              f'- Branch: `{branch}`',
              f'- Compared range: `{base}..{head}`',
              '',
              'This file is generated automatically. Repository documentation describes intent and status; diffs show recent implementation changes but are not proof of deployment.',
              '',
              '## 1. Commits included in this export',
              '```text', pushed_commits or 'No commit in the resolved range.', '```',
              '',
              '## 2. Last 20 commits on the branch',
              '```text', recent_commits or 'No commit history found.', '```',
              '',
              '## 3. Files and summary for this push',
              '```text', changed_files or 'No changed file.', '', diff_stat or 'No diff statistics.', '```',
              '',
              '## 4. Product documentation and implementation status',
              '### Recent documentation diff',
              '```diff', cap(docs_diff) if docs_diff else 'No documentation change in this push.', '```',
              '### Current source-of-truth documents',
              cap(full_docs, MAX_DOCS),
              '',
              '## 5. Backend, database, migrations and Edge Functions',
              '```diff', cap(backend_diff) if backend_diff else 'No backend change in this push.', '```',
              '',
              '## 6. Frontend, state, styles and public assets',
              '```diff', cap(frontend_diff) if frontend_diff else 'No frontend change in this push.', '```',
              '',
              '## 7. CI, scripts, dependencies and other delivery changes',
              '```diff', cap(delivery_diff) if delivery_diff else 'No other delivery change in this push.', '```',
              '',
          ]
          OUTPUT.write_text('\n'.join(sections), encoding='utf-8')
          print(f'{OUTPUT} generated: {OUTPUT.stat().st_size} bytes, range {base}..{head}')
          PY

      - name: Summarize generated context
        run: |
          {
            echo '## Gemini audit context'
            echo
            echo "Size: $(wc -c < latest_frontend_audit_context.md) bytes"
            echo "SHA-256: $(sha256sum latest_frontend_audit_context.md | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload context to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          filename = 'latest_frontend_audit_context.md'
          folder_id = os.environ['GDRIVE_FOLDER_ID']
          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ['GDRIVE_SERVICE_ACCOUNT_KEY']),
              scopes=['https://www.googleapis.com/auth/drive.file'],
          )
          drive = build('drive', 'v3', credentials=credentials, cache_discovery=False)
          escaped_name = filename.replace("'", "\\'")
          query = f"'{folder_id}' in parents and name='{escaped_name}' and trashed=false"
          response = drive.files().list(
              q=query,
              fields='files(id,name,modifiedTime)',
              orderBy='modifiedTime desc',
              pageSize=10,
              includeItemsFromAllDrives=True,
              supportsAllDrives=True,
          ).execute()
          files = response.get('files', [])
          media = MediaFileUpload(filename, mimetype='text/markdown', resumable=True)

          if files:
              result = drive.files().update(
                  fileId=files[0]['id'],
                  media_body=media,
                  fields='id,name,webViewLink',
                  supportsAllDrives=True,
              ).execute()
              action = 'updated'
          else:
              result = drive.files().create(
                  body={'name': filename, 'parents': [folder_id]},
                  media_body=media,
                  fields='id,name,webViewLink',
                  supportsAllDrives=True,
              ).execute()
              action = 'created'

          print(f"Drive file {action}: {result['name']} (ID: {result['id']})")
          PY
