name: Apply pending migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Saisir APPLY_PENDING pour appliquer migrations.pending.json en production
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: phyuijjekxtjvipjtdfv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Apply explicitly pending production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CONFIRM_APPLY: ${{ inputs.confirm }}
        run: |
          chmod +x scripts/prod-migration-sync.sh scripts/prod-migration-apply.sh
          bash scripts/prod-migration-apply.sh
      - name: Upload prod apply proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-migration-apply
          path: /tmp/prometheus-mig/
          if-no-files-found: ignore
