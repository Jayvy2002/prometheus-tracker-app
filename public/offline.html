<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prometheus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      background: #000;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 2rem;
      text-align: center;
    }
    img { width: 56px; height: 56px; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #a3a3a3; font-size: 0.95rem; margin-bottom: 2rem; max-width: 22rem; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      min-height: 44px;
      padding: 0.75rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    /* Same theme as the app (saved preference, or the phone for « Automatique »). */
    html[data-theme="light"] { color-scheme: light; }
    html[data-theme="light"] body { background: #f5f5f5; color: #171717; }
    html[data-theme="light"] p { color: #525252; }
    html[data-theme="light"] img { filter: invert(0.91); }
  </style>
  <script>
    (function () {
      try {
        var pref = 'dark';
        try {
          var saved = JSON.parse(localStorage.getItem('prometheus-prefs') || '{}');
          if (saved && (saved.theme === 'light' || saved.theme === 'system')) pref = saved.theme;
        } catch (e) {}
        var light = pref === 'light' || (pref === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <img src="/logo.svg" alt="Prometheus" />
  <h1 id="title">Hors ligne</h1>
  <p id="body">Tes données restent sur cet appareil. Vérifie ta connexion puis réessaie.</p>
  <button type="button" id="retry" onclick="location.reload()">Réessayer</button>
  <script>
    var en = (navigator.language || '').toLowerCase().indexOf('en') === 0;
    if (en) {
      document.documentElement.lang = 'en';
      document.getElementById('title').textContent = 'You’re offline';
      document.getElementById('body').textContent = 'Your data is still on this device. Check your connection, then try again.';
      document.getElementById('retry').textContent = 'Try again';
    }
  </script>
</body>
</html>
