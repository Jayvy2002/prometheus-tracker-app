<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prometheus — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    img { width: 48px; height: 48px; margin-bottom: 24px; opacity: 0.8; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #737373; line-height: 1.6; max-width: 280px; }
    .hint { margin-top: 24px; font-size: 12px; color: #525252; }
    button {
      margin-top: 28px;
      padding: 12px 28px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <img src="/logo.svg" alt="Prometheus" />
  <h1>Tu es hors ligne</h1>
  <p>Vérifie ta connexion internet et réessaie. Tes dernières données sont disponibles en cache.</p>
  <button onclick="window.location.reload()">Réessayer</button>
  <p class="hint">Les données saisies hors ligne seront synchronisées dès le retour du réseau.</p>
</body>
</html>
