[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — toutes les routes → index.html (React Router gère le reste)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service Worker : pas de cache sur sw.js pour que les mises à jour soient immédiates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Sécurité globale
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), geolocation=()"

