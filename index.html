<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Prometheus Fitness</title>
    <style>html{background:#000}html[data-theme="light"]{background:#f5f5f5}</style>
    <!-- Theme before the first paint (same rules as src/shared/theme/theme.ts). -->
    <script id="theme-boot">
      (function () {
        try {
          var pref = 'dark';
          try {
            var saved = JSON.parse(localStorage.getItem('prometheus-prefs') || '{}');
            if (saved && (saved.theme === 'light' || saved.theme === 'system')) pref = saved.theme;
          } catch (e) {}
          var light = pref === 'light' || (pref === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', light ? 'light' : 'dark');
          if (light) root.style.colorScheme = 'light';
          var color = document.querySelector('meta[name="theme-color"]');
          if (color) color.setAttribute('content', light ? '#f5f5f5' : '#000000');
          var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (bar) bar.setAttribute('content', light ? 'default' : 'black-translucent');
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="margin:0;">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <img src="/logo.svg" style="width:48px;height:48px;opacity:0.9;animation:pulse 1.5s ease-in-out infinite;" alt="Prometheus" />
      </div>
      <style>@keyframes pulse{0%,100%{opacity:0.9}50%{opacity:0.4}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
